<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwimData — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    background:linear-gradient(160deg,#0b2550 0%,#1560bd 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'DM Sans',sans-serif;
    padding:20px;
  }
  .card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    padding:36px 28px 28px;
    width:100%;max-width:380px;
    backdrop-filter:blur(10px);
  }
  .logo{
    font-family:'Bebas Neue',sans-serif;
    font-size:2.2rem;letter-spacing:4px;
    color:#f5c400;
    text-align:center;margin-bottom:4px;
  }
  .tagline{
    font-size:.6rem;letter-spacing:3px;text-transform:uppercase;
    color:rgba(255,255,255,.3);text-align:center;margin-bottom:32px;
  }
  .field-label{
    font-size:.75rem;font-weight:600;
    color:rgba(255,255,255,.55);
    margin-bottom:6px;
  }
  input{
    width:100%;
    background:rgba(255,255,255,.08);
    border:1.5px solid rgba(255,255,255,.15);
    border-radius:8px;
    padding:12px 14px;
    color:#fff;
    font-family:'DM Sans',sans-serif;
    font-size:.92rem;
    outline:none;
    transition:border-color .2s;
    margin-bottom:14px;
  }
  input:focus{border-color:rgba(255,255,255,.45);}
  input::placeholder{color:rgba(255,255,255,.3);}
  .btn-primary{
    width:100%;
    background:#f5c400;color:#0b2550;
    border:none;border-radius:10px;
    padding:14px;
    font-family:'Bebas Neue',sans-serif;
    font-size:1.1rem;letter-spacing:2px;
    cursor:pointer;
    transition:opacity .2s;
    margin-top:4px;
  }
  .btn-primary:hover{opacity:.88;}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .error{
    font-size:.78rem;color:#f87171;
    min-height:18px;
    text-align:center;
    margin:8px 0 4px;
  }
  .forgot{
    text-align:center;
    margin-top:14px;
  }
  .forgot button{
    background:none;border:none;
    color:rgba(255,255,255,.4);
    font-family:'DM Sans',sans-serif;
    font-size:.75rem;cursor:pointer;
    text-decoration:underline;
    padding:0;width:auto;margin:0;
  }
  .forgot button:hover{color:rgba(255,255,255,.65);}
  .forgot-msg{
    font-size:.75rem;text-align:center;
    margin-top:8px;min-height:16px;
    color:rgba(255,255,255,.55);
  }
  #forgot-section{display:none;margin-top:14px;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">SWIMDATA</div>
  <div class="tagline">La plateforme des coachs de natation</div>

  <div class="field-label">Email</div>
  <input type="email" id="login-email" placeholder="coach@monclub.fr"
    onkeydown="if(event.key==='Enter')document.getElementById('login-password').focus()">

  <div class="field-label">Mot de passe</div>
  <input type="password" id="login-password" placeholder="••••••••"
    onkeydown="if(event.key==='Enter')submitLogin()">

  <div class="error" id="login-error"></div>

  <button class="btn-primary" id="login-btn" onclick="submitLogin()">SE CONNECTER</button>

  <div class="forgot">
    <button onclick="toggleForgot()">Mot de passe oublié ?</button>
  </div>

  <div id="forgot-section">
    <input type="email" id="forgot-email" placeholder="Votre email" style="margin-top:8px">
    <button class="btn-primary" onclick="submitForgot()" style="background:rgba(255,255,255,.15);color:#fff;margin-top:0">ENVOYER LE LIEN</button>
    <div class="forgot-msg" id="forgot-msg"></div>
  </div>
</div>

<script>
// ── SUPABASE CONFIG (mêmes valeurs que dans index.html) ──
var _SB_URL  = 'https://girspxdolhsuvmkkgngb.supabase.co';
var _SB_ANON = 'sb_publishable_0g2OLZxdskIL3tSUllA5vQ_2WNKpFLv';
var _sb = supabase.createClient(_SB_URL, _SB_ANON);

async function submitLogin(){
  var email = document.getElementById('login-email').value.trim();
  var password = document.getElementById('login-password').value;
  var errEl = document.getElementById('login-error');
  var btn = document.getElementById('login-btn');
  errEl.textContent = '';
  if(!email||!password){errEl.textContent='Email et mot de passe requis.';return;}
  btn.disabled = true;
  btn.textContent = 'CONNEXION…';
  var {data, error} = await _sb.auth.signInWithPassword({email, password});
  if(error){
    errEl.textContent = error.message;
    btn.disabled = false;
    btn.textContent = 'SE CONNECTER';
    return;
  }
  var role = data.user && data.user.user_metadata && data.user.user_metadata.role;
  if(role === 'swimmer'){
    window.location.href = '/swimmer.html';
  } else {
    window.location.href = '/';
  }
}

function toggleForgot(){
  var s = document.getElementById('forgot-section');
  s.style.display = s.style.display === 'none' ? 'block' : 'none';
}

async function submitForgot(){
  var email = document.getElementById('forgot-email').value.trim();
  var msg = document.getElementById('forgot-msg');
  if(!email){msg.textContent='Entrez votre email.';return;}
  msg.textContent = 'Envoi en cours…';
  var {error} = await _sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/login.html'
  });
  if(error){msg.textContent = error.message; return;}
  msg.textContent = '✅ Lien envoyé — vérifiez votre boite mail.';
}

// Redirige si déjà connecté
(async function(){
  var {data} = await _sb.auth.getSession();
  if(data && data.session){
    var role = data.session.user && data.session.user.user_metadata && data.session.user.user_metadata.role;
    window.location.href = (role === 'swimmer') ? '/swimmer.html' : '/';
  }
})();
</script>
</body>
</html>
